name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q AjzTracker_Android_Project_v2.zip -d .
          cd AjzTracker
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AjzTracker-APK
          path: AjzTracker/app/build/outputs/apk/debug/app-debug.apk
